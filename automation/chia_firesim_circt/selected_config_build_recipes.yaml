# Fixed four-config correctness/performance set. Do not enumerate staging recipes.
# Three entries are copied from sims/firesim-staging/sample_config_build_recipes.yaml.
# Plain Shuttle is absent there: derive its F2 recipe from the MegaBoom no-NIC
# recipe, replacing only TARGET_CONFIG with the full composed FireSim target:
# WithDefaultFireSimBridges_WithFireSimTestChipConfigTweaks_chipyard.ShuttleConfig.
# Keep these FireSim fragments: bare chipyard.ShuttleConfig does not include them.
# Saturn's FireSimGENV256D128ShuttleConfig already composes the FireSim bridge
# and design tweaks in firechip/chip/src/main/scala/TargetConfigs.scala.
# The inherited 50 MHz request is provisional until its first successful F2 build.
# Recipe paths are relative to sims/firesim/deploy, where the manager runs.

firesim_rocket_singlecore_no_nic_l2_lbp:
    PLATFORM: f2
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: WithDefaultFireSimBridges_WithFireSimHighPerfConfigTweaks_chipyard.RocketConfig
    PLATFORM_CONFIG: BaseF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 90
        build_strategy: TIMING
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml

firesim_megaboom_singlecore_no_nic_l2_llc4mb_ddr3:
    PLATFORM: f2
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: WithDefaultFireSimBridges_WithFireSimTestChipConfigTweaks_chipyard.MegaBoomV3Config
    PLATFORM_CONFIG: WithAutoILA_FRFCFS16GBQuadRankLLC4MB_BaseF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 50
        build_strategy: TIMING
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml

