# Local shared-checkout CHIA worker; Jasper is remote via its adapter, and
# FireSim Manager provisions F2 through runtime YAML. These resources identify
# separate verification tasks, not separate physical hosts. Never upload this
# checkout with --working-dir.
cluster_name: firesim-circt-local
provider:
  head_ip: 127.0.0.1
auth:
  ssh_user: ${USER}
available_node_types:
  firesim_circt_agent:
    resources: {"codex_creds": 1, "firesim_manager": 1, "golden_compare": 1, "jasper": 1, "compile_benchmark": 1}
    num_workers: 1
    compatible_ips: [127.0.0.1]
    worker_env_commands:
      - "source /home/ubuntu/miniforge3/etc/profile.d/conda.sh && cd /scratch/jfx/fsim-circt/sims/firesim && source ./sourceme-manager.sh && cd /scratch/jfx/fsim-circt"
head_env_commands:
  - "source /home/ubuntu/miniforge3/etc/profile.d/conda.sh && cd /scratch/jfx/fsim-circt/sims/firesim && source ./sourceme-manager.sh && cd /scratch/jfx/fsim-circt"
head_start_ray_commands:
  - ray stop
  - ray start --head --port=6379 --include-dashboard=True --dashboard-agent-listen-port=0
worker_start_ray_commands:
  - ray stop
  - ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0
file_mounts: {}
