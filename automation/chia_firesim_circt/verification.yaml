  - automation/chia_firesim_circt/run_f2.py
  - automation/chia_firesim_circt/f2_manager.py
  - automation/chia_firesim_circt/prepare_f2_linux.py
  - sims/firesim/deploy/workloads/br-base-uniform.json
  - software/firemarshal/images/firechip/br-base/br-base-bin
  - software/firemarshal/images/firechip/br-base/br-base.img
