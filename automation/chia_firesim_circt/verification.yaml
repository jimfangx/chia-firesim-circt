feature_scope_file: automation/chia_firesim_circt/feature_scope.yaml
feature_evidence_root: automation/chia_firesim_circt/logs/feature-evidence
# List tool binaries, golden manifests, untracked implementation sources, and all
# imported config/constraint files here so changing them invalidates every gate.
identity_files:
