# Human runbook. See README.md and verification.yaml for the adapter contract.
prerequisite:
  description: >-
    Install CHIA/Ray/Codex in the manager environment; configure AWS F2 and local
    Vivado. Complete the four golden/semantic, LEC, SEC, F2 and timing adapters.
    Missing adapters intentionally block verification. The loop does not claim
    that these tools or compiler F2 support are already available. On F2 source
    sourceme-manager.sh without --skip-ssh-setup; SSH key setup is required.
  commands: |
    source /home/ubuntu/miniforge3/etc/profile.d/conda.sh
    cd /scratch/jfx/fsim-circt/sims/firesim
    source ./sourceme-manager.sh
    ssh -o BatchMode=yes localhost true
    ssh -o BatchMode=yes eda true
    command -v chia
    command -v codex
    python -c 'import ray, chia, yaml'
start_cluster:
  commands: |
    source /home/ubuntu/miniforge3/etc/profile.d/conda.sh
    cd /scratch/jfx/fsim-circt/sims/firesim
    source ./sourceme-manager.sh
    cd /scratch/jfx/fsim-circt
    mkdir -p sims/firesim/deploy/build-farm sims/firesim/deploy/run-farm
    chia up automation/chia_firesim_circt/cluster.yaml
    chia status --chia-cluster automation/chia_firesim_circt/cluster.yaml
job_submission:
  description: >-
    Current November 3 verification restart; verify the saved candidate first.
    Shared checkout; omit --working-dir to avoid uploading the entire tree.
  command: |
    chia job submit -- python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 9999 --verify full --verification-first --implementation-timeout-seconds 14400 --model gpt-6.1-sol
verification:
  description: >-
    Exactly Rocket, MegaBoomV3, plain Shuttle, and Saturn Shuttle. Semantic success
    fans out separate Jasper LEC+SEC and local-build/F2 manager nodes. Join both,
    then compare SFC/CIRCT FireSim compiler wall time, from pre-MIDAS inputs to
    emitted simulator RTL/collateral, without Vivado contention. Simulation or
    workload runtime is excluded from the speed metric. The main agent
    joins all subagents before returning; no source edits occur during verification.
    FAME5, enabled AutoCounter/Print, multi-clock/generalized models and NIC are
    required full-port streams in feature_scope.yaml; QSFP is deferred. Prefer
    concurrent owners when dependencies allow. Each enabled representative must
    pass semantic comparison, LEC and SEC, and feature-exercising Linux boot and
    poweroff. The features audit must pass along with all baseline nodes for the
    same candidate; LOOP_COMPLETE: yes cannot accept a baseline-only result.
    No Rocket streak or full sample-recipe enumeration.
feature_implementation:
  description: >-
    Historical November 2 development phase, superseded by the November 3 full
    verification restart above. In this mode formal stays disabled. Each completed coding turn runs the exact four
    baseline semantic checks. Passing candidates are frozen into isolated F2
    background jobs; implementation immediately continues without joining FPGA
    execution. Failed semantics return to repair. Feature implementation readiness
    requires actual production artifacts and successful command receipts; it
    does not establish final formal, Linux or compiler-speed acceptance.
  command: |
    chia job submit -- python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 9999 --verify feature-implementation --model gpt-6.1-sol
  background_evidence: automation/chia_firesim_circt/logs/background-f2/
  implementation_evidence: automation/chia_firesim_circt/logs/feature-implementation/
model:
  live_control_file: automation/chia_firesim_circt/control.yaml
  per_loop_override: --model <model-name>
  description: control.yaml is reread before each implementation call.
diagnostics:
  description: Legacy U250 compile/metasim checks are available but cannot complete the new goal.
  command: |
    chia job submit -- python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 1 --verify preflight
stop:
  commands: |
    chia job list
    chia job stop <job-id>
    chia down automation/chia_firesim_circt/cluster.yaml
  description: >-
    Allow the FireSim adapter to clean up its tagged F2 run farm before stopping.
    If a process is forcibly killed, inspect manager state and terminate its farm
    explicitly. Stop the old job before changing/replacing the local cluster.
