# FireSim CIRCT Chia loop: human runbook

prerequisite:
  description: Passwordless SSH to the local manager host is required by both Chia and FireSim.
  commands: |
    ssh -o BatchMode=yes 127.0.0.1 true
    ssh -o BatchMode=yes localhost true

start_cluster:
  commands: |
    source /home/firesim/miniforge3/etc/profile.d/conda.sh
    cd /scratch/jfx/fsim-circt/sims/firesim
    source ./sourceme-manager.sh --skip-ssh-setup
    cd /scratch/jfx/fsim-circt
    mkdir -p sims/firesim/deploy/build-farm sims/firesim/deploy/run-farm
    chia up automation/chia_firesim_circt/cluster.yaml
    chia status --chia-cluster automation/chia_firesim_circt/cluster.yaml

job_submission:
  description: >-
    This is a localhost shared-checkout cluster. Do not add
    --working-dir /scratch/jfx/fsim-circt: Ray would package and upload the
    35 GiB checkout, while the worker already has that exact path mounted.
  command_shape: >-
    chia job submit -- python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py <loop-options>

model:
  default: Codex CLI default model
  per_loop_override: --model <model-name>
  example: --model <your-codex-model>
  live_control_file: automation/chia_firesim_circt/control.yaml
  live_change: Change `model` in control.yaml; the next Codex iteration uses it without restarting the job.

preflight:
  description: Verify Chia, Codex CLI, FireSim CLI, and configuration without compiling RTL.
  command: |
    chia job submit -- \
      python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 1 --verify preflight
  with_model: |
    chia job submit -- \
      python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 1 --verify preflight --model <model-name>

autonomous_full_loop:
  description: >-
    One bounded autonomous task. Codex focuses on the core Golden Gate
    compiler under sims/firesim/sim, using the Scala SFC implementation as the
    oracle and FIRESIM_CIRCT_PORT_PLAN.md as its milestone order. Automation,
    FireMarshal, workloads, Python helpers, runtime YAML, and Ray/Chia plumbing
    are strongly discouraged unless minimally required to unblock a core change
    or golden comparison; they never count as porting work on their own. Each
    core change compares its candidate output with the relevant recorded SFC
    golden artifact. Each iteration then runs replacertl
    compile, a bounded bare-metal Verilator
    metasimulation (volatile-memory checksum, UART PASS marker, tohost exit),
    and enables FireSim tracing. The U250 Linux build/boot gate runs only after
    15 consecutive bare-metal passes; any bare or hardware failure resets the
    streak. A failed gate is supplied to the next iteration. A full pass
    continues porting until Codex explicitly emits LOOP_COMPLETE: yes after a
    scheduled hardware pass; the FireMarshal poweroff workload cleanly powers
    down Buildroot, then run-farm termination runs before the next iteration.
  command: |
    chia job submit -- \
      python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 12 --verify full
  with_model: |
    chia job submit -- \
      python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 12 --verify full --model <model-name>

baremetal_metasim:
  description: >-
    Faster functional compiler gate: compile transformed RTL, run the small
    bare-metal checksum program under Verilator, require its UART PASS marker,
    and terminate the metasim run farm. It does not build a U250 bitstream or
    boot Linux.
  command: |
    chia job submit -- \
      python /scratch/jfx/fsim-circt/automation/chia_firesim_circt/loop.py --iterations 1 --verify metasim

stop_previous_job:
  description: >-
    Stop a previous loop before replacing it. Stopping preserves source edits
    in the shared checkout and retains logs. Deleting is optional and removes
    only stopped-job Ray metadata.
  commands: |
    chia job list
    chia job stop <job-id>
    chia job delete <job-id>  # optional, after it has stopped

stop_cluster:
  command: chia down automation/chia_firesim_circt/cluster.yaml
